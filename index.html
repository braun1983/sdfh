   <section class="hero">

  <!-- Marcações de canto -->
  <span class="hero__corner hero__corner--top-left"></span>
  <span class="hero__corner hero__corner--top-right"></span>
  <span class="hero__corner hero__corner--bottom-left"></span>
  <span class="hero__corner hero__corner--bottom-right"></span>

  <div class="hero__content">

    <!-- Logo -->
    <div class="hero__logo-box">
      <img src="/assets/img/logo_branca.png" alt="Skydiving From Hell" class="hero__logo" />
    </div>

    <!-- Título -->
    <h1 class="hero__title">
      <span class="hero__title-line">Vila Velha</span>
      <span class="hero__title-line hero__title-line--accent">Hardcore</span>
    </h1>

    <!-- CTA -->
    <a href="#ouvir" class="hero__cta">
      <svg class="hero__cta-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor" />
      </svg>
      <span>Ouça Agora</span>
    </a>

  </div>

  <!-- Status do sistema (rodapé) -->
  <div class="hero__status">
    <p class="hero__status-line">SYS.STAT: <span class="hero__status-value">ONLINE</span></p>
    <p class="hero__status-line">COORD: <span class="hero__status-value">-20.3297, -40.2925</span></p>
  </div>

</section>
